<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6f2dbd">
  <title>عيد ميلاد سعيد</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
    :root { --purple:#6f2dbd; --pink:#ff7096; --yellow:#ffd166; --navy:#21143d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; font-family:"Tajawal",sans-serif; color:var(--navy); background:linear-gradient(150deg,#fff3f7 0%,#f0e7ff 55%,#e3f8ff 100%); }
    .blob { position:fixed; border-radius:50%; opacity:.75; filter:blur(2px); animation:float 6s ease-in-out infinite; }
    .b1 { width:160px;height:160px;background:#ffd166;top:-60px;left:8%; } .b2 { width:220px;height:220px;background:#ffb3c6;bottom:-100px;right:-50px;animation-delay:-2s; } .b3 { width:110px;height:110px;background:#b8e0ff;top:16%;right:8%;animation-delay:-4s; }
    @keyframes float { 50% { transform:translateY(18px) rotate(8deg); } }
    main { position:relative; z-index:2; width:min(92%,720px); padding:clamp(2.2rem,6vw,4.8rem); text-align:center; border-radius:38px; background:rgba(255,255,255,.8); border:2px solid #fff; box-shadow:0 28px 80px rgba(83,45,130,.16); backdrop-filter:blur(16px); }
    .cake { position:relative; width:130px; height:112px; margin:0 auto 1.4rem; }
    .flame { width:18px; height:28px; margin:auto; border-radius:60% 40% 60% 40%; background:var(--yellow); box-shadow:0 0 24px #ff9f1c; transform:rotate(45deg); animation:flicker .9s infinite alternate; }
    .candle { width:15px;height:32px;margin:4px auto 0;border-radius:4px;background:repeating-linear-gradient(45deg,#fff 0 5px,var(--pink) 6px 11px); }
    .cake-top { height:29px;border-radius:18px 18px 8px 8px;background:#ff8fab;box-shadow:inset 0 -8px rgba(255,255,255,.24); }
    .cake-base { width:115px;height:48px;margin:auto;border-radius:5px 5px 18px 18px;background:linear-gradient(90deg,#8b5cf6,#b067e8); }
    .cake-base::after { content:""; display:block; width:76px;height:8px;margin:auto;border-radius:0 0 10px 10px;background:#fff0f4; }
    .eyebrow { color:var(--purple);font-weight:800;font-size:.92rem;letter-spacing:.12em; }
    h1 { margin:.5rem 0 .8rem;font-size:clamp(2.9rem,9vw,5.6rem);line-height:1.05;letter-spacing:-.05em; }
    p { margin:0 auto;max-width:510px;color:#65547d;font-size:clamp(1rem,2.3vw,1.3rem);line-height:1.9; }
    button { margin-top:1.8rem;padding:.9rem 1.65rem;border:0;border-radius:999px;color:#fff;background:linear-gradient(90deg,var(--purple),var(--pink));font:700 1rem "Tajawal";cursor:pointer;box-shadow:0 10px 24px rgba(111,45,189,.28);transition:.2s; }
    button:hover { transform:scale(1.04); }
    .spark { position:fixed; z-index:4; pointer-events:none; width:8px;height:8px;border-radius:50%; animation:pop 1s ease-out forwards; }
    @keyframes pop { to { transform:translate(var(--x),var(--y)) scale(0);opacity:0; } }
    @keyframes flicker { to { transform:rotate(40deg) scale(.82); } }
    @media (prefers-reduced-motion:reduce) { * { animation:none!important;transition:none!important; } }
  </style>
</head>
<body>
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
  <main aria-labelledby="title">
    <div class="cake" aria-hidden="true"><div class="flame"></div><div class="candle"></div><div class="cake-top"></div><div class="cake-base"></div></div>
    <div class="eyebrow">يومك المميز</div>
    <h1 id="title">عيد ميلاد سعيد</h1>
    <p>عام جديد من الحكايات الجميلة والضحكات الصادقة. عسى أيامك القادمة أن تكون أخفّ وأبهج وأقرب لأمنياتك.</p>
    <button id="wish" type="button">أطلق أمنيتك</button>
  </main>
  <script>
    const btn=document.getElementById('wish');
    btn.addEventListener('click',()=>{const r=btn.getBoundingClientRect();for(let i=0;i<42;i++){const s=document.createElement('i');s.className='spark';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.background=['#ff7096','#ffd166','#6f2dbd','#45b7d1'][i%4];const a=Math.random()*Math.PI*2,d=60+Math.random()*180;s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1100)}});
  </script>
</body>
</html>
